<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headline Scraper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <div class="header-inner">
          <div class="logo">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 11a9 9 0 0 1 9 9" />
              <path d="M4 4a16 16 0 0 1 16 16" />
              <circle cx="5" cy="19" r="1" />
            </svg>
            <h1>Headline Scraper</h1>
          </div>
          <p class="tagline">
            Monitor competitor blogs &mdash; headlines &amp; summaries at a
            glance.
          </p>
        </div>
      </header>

      <!-- Scrape Input -->
      <section class="scrape-section">
        <form id="scrapeForm" class="scrape-form">
          <div class="input-group">
            <svg
              class="input-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path
                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
              />
            </svg>
            <input
              type="url"
              id="urlInput"
              placeholder="Enter a competitor's blog URL..."
              required
            />
            <button type="submit" id="scrapeBtn">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
              </svg>
              <span>Scrape</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Search & Filter (hidden until results exist) -->
      <section id="filterSection" class="filter-section hidden">
        <div class="search-bar">
          <svg
            class="search-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search headlines..."
          />
          <span id="resultCount" class="result-count"></span>
        </div>
      </section>

      <!-- Loading State -->
      <div id="loader" class="loader hidden">
        <div class="spinner"></div>
        <p>Scraping headlines and generating summaries...</p>
      </div>

      <!-- Error State -->
      <div id="errorMsg" class="error-msg hidden"></div>

      <!-- Results -->
      <section id="results" class="results hidden">
        <div class="results-header">
          <h2 id="sourceLabel"></h2>
        </div>
        <div id="headlineList" class="headline-list"></div>
      </section>

      <!-- Empty state -->
      <section id="emptyState" class="empty-state">
        <svg
          width="64"
          height="64"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 11a9 9 0 0 1 9 9" />
          <path d="M4 4a16 16 0 0 1 16 16" />
          <circle cx="5" cy="19" r="1" />
        </svg>
        <h3>No headlines yet</h3>
        <p>Enter a competitor's blog URL above to get started.</p>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
